<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML Injector</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #d7d7d7;
      --accent: #111111;
      --accent-soft: #e6e6e6;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 48px 24px 96px;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 6px 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 32px;
    }

    .drop-zone {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .drop-zone:hover {
      border-color: var(--accent);
    }

    .drop-zone:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .drop-zone[aria-dropeffect="none"] {
      cursor: default;
    }

    .drop-zone.is-dragging {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .drop-zone svg {
      display: block;
      color: var(--muted);
      width: 28px;
      height: 28px;
      margin-bottom: 12px;
    }

    .drop-zone .label {
      font-size: 14px;
      color: var(--muted);
    }

    .drop-zone .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .drop-zone .filename {
      display: none;
      font-size: 13px;
      color: var(--text);
      margin-top: 10px;
      word-break: break-all;
    }

    .drop-zone.has-file .filename {
      display: block;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .btn:hover {
      background: var(--accent-soft);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn.primary:hover {
      background: #2a2a2a;
    }

    .status {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error {
      color: #a33a3a;
    }

    .status.ok {
      color: #116e3e;
    }

    .notice {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .notice strong {
      color: var(--text);
    }

    @media (max-width: 480px) {
      body {
        padding: 28px 16px 72px;
      }

      .drop-zone {
        padding: 24px 16px;
      }

      .actions {
        gap: 10px;
      }

      .btn {
        font-size: 13px;
        padding: 9px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>HTML Injector</h1>
    <p class="subtitle">Choose an HTML file to open in a new blank tab.</p>

    <div
      class="drop-zone"
      id="dropZone"
      tabindex="0"
      role="button"
      aria-label="Select an HTML file"
      aria-dropeffect="none"
      aria-live="polite"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
      </svg>
      <div class="label">Choose an HTML file</div>
      <div class="hint">Only HTML files</div>
      <div class="filename" id="fileName"></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="injectBtn" disabled>Open in new tab</button>
      <button class="btn" id="downloadBtn" disabled>Download</button>
      <button class="btn" id="clearBtn" disabled>Clear</button>
    </div>

    <p class="status" id="status" role="status"></p>

    <p class="notice">
      <strong>How it works:</strong> a new tab is opened with <code>about:blank</code>, and the
      contents of the selected HTML file are injected into it.
    </p>
  </div>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileName = document.getElementById("fileName");
    const injectBtn = document.getElementById("injectBtn");
    const clearBtn = document.getElementById("clearBtn");
    const status = document.getElementById("status");

    let file = null;
    let fileDataUrl = null;

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = kind || "";
    }

    function reset() {
      file = null;
      fileDataUrl = null;
      dropZone.classList.remove("is-dragging");
      dropZone.setAttribute("aria-dropeffect", "none");
      dropZone.classList.remove("has-file");
      injectBtn.disabled = true;
      downloadBtn.disabled = true;
      clearBtn.disabled = true;
      fileName.textContent = "";
      setStatus("");
    }

    function setFileName(name) {
      fileName.textContent = name;
      dropZone.classList.add("has-file");
      injectBtn.disabled = false;
      clearBtn.disabled = false;
      downloadBtn.disabled = false;
      fileDataUrl = null;
    }

    function readFileAsText(f) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error(reader.error ? reader.error.message : "Failed to read file."));
        reader.readAsText(f);
      });
    }

    dropZone.addEventListener("click", () => {
      inputEl.click();
    });

    dropZone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        inputEl.click();
      }
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      dropZone.classList.add("is-dragging");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("is-dragging");
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-dragging");
      if (!e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
      handleFile(e.dataTransfer.files[0]);
    });

    const inputEl = document.createElement("input");
    inputEl.type = "file";
    inputEl.accept=".html,text/html,application/xhtml+xml";
    inputEl.hidden = true;
    document.body.appendChild(inputEl);

    inputEl.addEventListener("change", () => {
      if (inputEl.files && inputEl.files.length > 0) {
        handleFile(inputEl.files[0]);
      }
      inputEl.value = "";
    });

    function handleFile(f) {
      if (!f) return;
      if (!f.type.includes("html") && !/\.html$/i.test(f.name)) {
        setStatus("Please choose an HTML file.", "error");
        reset();
        return;
      }
      file = f;
      setFileName(f.name);
      setStatus("Ready. Select a file to inject, then open it in a new tab.", "ok");
      if (typeof URL !== "undefined") {
        fileDataUrl = URL.createObjectURL(f);
      }
    }

    injectBtn.addEventListener("click", async () => {
      if (!file) return;
      injectBtn.disabled = true;
      injectBtn.textContent = "Opening…";
      setStatus("Opening a new tab…", "");

      try {
        const html = await readFileAsText(file);

        const url = "data:text/html;charset=utf-8," + encodeURIComponent(html);

        const win = window.open(url, "_blank");
        if (!win) {
          setStatus("Could not open a new tab. Please allow pop-ups for this site.", "error");
          reset();
          return;
        }

        setStatus(`Opened "${file.name}" in a new blank tab.`, "ok");
        reset();
      } catch (err) {
        setStatus("Could not read the file: " + err.message, "error");
        reset();
      }
    });

    clearBtn.addEventListener("click", () => {
      reset();
      setStatus("Cleared. Choose a new file.", "");
      inputEl.value = "";
    });

    reset();
  </script>
</body>
</html>
