<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTML Injector</title>
</head>
<body>
  <h1>HTML Injector</h1>

  <input id="file" type="file" accept=".html,.htm,text/html" />
  <button id="openBtn" disabled>Open in new tab</button>

  <script>
    const input = document.getElementById("file");
    const openBtn = document.getElementById("openBtn");

    let file = null;

    input.addEventListener("change", () => {
      file = input.files && input.files[0] ? input.files[0] : null;
      openBtn.disabled = !file;
    });

    openBtn.addEventListener("click", async () => {
      if (!file) return;

      // Must open while we still have the click gesture, before any await.
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Could not open a new tab. Please allow pop-ups for this page.");
        return;
      }

      try {
        win.document.write(await file.text());
        win.document.close();
      } catch (err) {
        win.close();
        alert("Could not read the file: " + err.message);
      }
    });
  </script>
</body>
</html>
